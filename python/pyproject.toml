[project]
name = "myescapeplan"
version = "0.1.0"
description = "MyEscapePlan Business Travel API"
authors = [
  { name = "MyEscapePlan", email = "engineering@myescapeplan.app" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["MyEscapePlan", "Business Travel API", "SDK"]
dependencies = [
  "python-dateutil (>=2.8.2)",
  "httpx (>=0.28.1)",
  "pydantic (>=2.11)",
  "typing-extensions (>=4.7.1)",
]

[project.urls]
Homepage = "https://github.com/myescapeplan/myescapeplan-sdk#readme"
Issues = "https://github.com/myescapeplan/myescapeplan-sdk/issues"
Repository = "https://github.com/myescapeplan/myescapeplan-sdk"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
